name: Site

# Deploys the site with Alchemy (apps/site/alchemy.run.ts): main to the `prod` stage at
# amends.dev, and each pull request opened from this repository to a `pr-<number>` preview,
# destroyed when the pull request closes. The secrets come from stacks/github.ts.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]

# One deployment of a stage at a time; a newer push waits rather than interrupting a deploy.
concurrency:
  group: site-${{ github.event.pull_request.number || 'prod' }}
  cancel-in-progress: false

permissions: {}

jobs:
  deploy:
    name: Deploy
    # Pull requests from forks get no secrets, so only this repository's members get previews.
    if: >-
      github.event_name == 'push' || (github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
      github.event.pull_request.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Deploy
        working-directory: apps/site
        run: bun alchemy deploy --stage "$STAGE" --yes
        env:
          STAGE: ${{ github.event_name == 'push' && 'prod' || format('pr-{0}', github.event.number) }}
          PULL_REQUEST: ${{ github.event.number }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  destroy:
    name: Destroy preview
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
      github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merged && github.event.pull_request.merge_commit_sha || github.event.pull_request.base.sha }}
      - uses: ./.github/actions/setup
      - name: Destroy
        working-directory: apps/site
        run: bun alchemy destroy --stage "pr-$PULL_REQUEST" --yes
        env:
          PULL_REQUEST: ${{ github.event.number }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
